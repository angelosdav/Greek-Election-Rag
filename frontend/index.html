<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ιδεολογικό Αποτύπωμα - ELECTION MAP</title>
    <style>
        :root {
            --bg-color: #192841;
            --tab-bg: #2a3b56;
            --tab-active: #3498db;
            --text-color: #ffffff;
            --text-muted: #a0aab8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Arial", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Disable scrolling on main body to let iframe scroll */
        }

        /* Header / Tab Navigation */
        .header {
            background-color: #111b2b; /* Slightly darker than bg for contrast */
            padding: 15px 20px 0 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            color: var(--text-color);
            margin-right: 40px;
            padding-bottom: 15px;
        }

        .tabs-container {
            display: flex;
            gap: 5px;
            flex-grow: 1;
        }

        .tab-btn {
            background-color: var(--tab-bg);
            color: var(--text-muted);
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s ease;
            outline: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            background-color: #3d506e;
            color: var(--text-color);
        }

        .tab-btn.active {
            background-color: var(--bg-color);
            color: var(--text-color);
            border-top: 3px solid var(--tab-active);
        }

        /* Iframe Container */
        .content-container {
            flex-grow: 1;
            width: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">🏛️ ELECTION MAP</div>
        <div class="tabs-container">
            <button class="tab-btn active" onclick="openTab('parliament.html', this)">
                Σύνθεση της Βουλής
            </button>
            <button class="tab-btn" onclick="openTab('political_compass.html', this)">
                Πολιτική Πυξίδα
            </button>
            <button class="tab-btn" onclick="openTab('quiz.html', this)">
                Quiz
            </button>
            <button class="tab-btn" onclick="openTab('issue_axes.html', this)">
                Θεματική Ανάλυση
            </button>
            <button class="tab-btn" onclick="openTab('fun_facts.html', this)">
                Fun Facts
            </button>
            <button class="tab-btn" onclick="openTab('ai_analyst.html', this)">
                AI Αναλυτής
            </button>
        </div>
    </div>

    <div class="content-container">
        <!-- Default src is parliament -->
        <script>
            document.write('<iframe id="vizFrame" src="parliament.html?v=' + new Date().getTime() + '" title="Visualization View"></iframe>');
        </script>
    </div>

    <script>
        function openTab(url, btnElement) {
            // Update iframe src with a cache buster
            document.getElementById("vizFrame").src = url + "?v=" + new Date().getTime();

            // Remove active class from all buttons
            const buttons = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
            }

            // Add active class to the clicked button
            btnElement.classList.add("active");
        }
    </script>

</body>
</html>
